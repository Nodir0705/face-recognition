plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.attendancespike'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.attendancespike"
        minSdk 24          // MediaPipe Tasks 0.10.x requires Android 7+. The old
                           // SM-T280 (Android 5.1) is no longer supported; SM-T583
                           // (Android 8) is fine.
        targetSdk 33
        versionCode 1
        versionName "0.1"
        // Tablets we ship to are all 32-bit ARM; dropping x86/arm64 native libs
        // shaves ~10 MB and makes USB installs reliable on flaky cables.
        ndk { abiFilters 'armeabi-v7a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }

    androidResources {
        noCompress 'tflite', 'task'
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // CameraX — works back to API 21
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // MediaPipe Tasks — Face Landmarker (478 landmarks + head transform matrix).
    // Replaces ML Kit (kiosk + enrollment) and BlazeFace with one detector that
    // gives both tight face localization and head pose.
    implementation 'com.google.mediapipe:tasks-vision:0.10.18'

    // TensorFlow Lite — used only by MobileFaceNet (the embedder).
    // 2.8.0 was needed for the old Android 5.1 tablet; minSdk is now 24 so we
    // could bump to 2.14+, but 2.8.0 still works fine on API 24+.
    implementation 'org.tensorflow:tensorflow-lite:2.8.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.8.0'
}
